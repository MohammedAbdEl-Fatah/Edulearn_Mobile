include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning

linter:
  rules:
    avoid_print: true # Uncomment to disable the `avoid_print` rule
    prefer_const_constructors: true # const constructors are more efficient
    prefer_const_declarations: true # const declarations are more efficient
    unawaited_futures: true # Uncomment to disable the `unawaited_futures` rule

# https://dart.dev/guides/language/analysis-options
